# Supabase configuration
# See: https://supabase.com/docs/guides/cli/config

# Project ID is passed via --project-ref flag during deployment

[db]
# Port to use for the local database
port = 54322

[api]
# Port to use for the API
port = 54321

[functions.process-text]
# The handler verifies the service-role key before calling Groq.
# Text processing is called only by the trusted processing worker.
verify_jwt = false

[functions.validate-quiz]
# Disable JWT verification, this function validates quiz quality
# and is called by the worker, not directly by users
verify_jwt = false

[functions.process-text-worker]
# The handler verifies X-Worker-Token through a service-role-only Vault RPC.
# Configure the credential and cron headers in hosted Supabase before deployment.
verify_jwt = false

[functions.validate-quiz-worker]
# The handler verifies X-Worker-Token through a service-role-only Vault RPC.
# Configure the credential and cron headers in hosted Supabase before deployment.
verify_jwt = false

[functions.leaderboard]
# Called by the frontend after quiz save to update Redis leaderboard cache.
# The handler verifies the user token with Supabase Auth before service-role use.
verify_jwt = false

[functions.populate-quizzes]
# Maintenance access also requires the exact service-role bearer in the handler.
verify_jwt = true

[functions.populate-summaries]
# The handler requires the exact service-role bearer before database access.
verify_jwt = false
