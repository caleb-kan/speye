name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Install backend deps
        run: npm ci --prefix backend
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: test-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Install backend deps
        run: npm ci --prefix backend
      - name: Frontend unit tests
        run: npm run test:run --prefix frontend
      - name: Backend unit tests
        run: npm run test:run --prefix backend

  database-tests:
    name: Database regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test database policies and concurrent matchmaking
        run: npm run test:db --prefix backend

  edge-typecheck:
    name: Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check deployed Edge Function sources
        run: npm exec --yes --package deno@2.9.6 -- deno check --no-lock --node-modules-dir=none backend/supabase/functions/*/index.ts

  build:
    name: Build (smoke)
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests, database-tests, edge-typecheck]
    env:
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: test-anon-key
      VITE_UPSTASH_REDIS_REST_URL: http://localhost:8079
      VITE_UPSTASH_REDIS_REST_READ_TOKEN: test-token
      VITE_BASE_PATH: /
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      - run: npm run build
